# Reverse proxy in front of the Daphne ASGI app.
#
# Responsibilities kept here rather than in Django:
# - TLS termination (fill in ssl_certificate/ssl_certificate_key, or
#   terminate TLS one layer further out at a cloud load balancer and
#   drop the `listen 443 ssl` block entirely -- either is fine, just
#   keep SECURE_SSL_REDIRECT/HSTS in Django either way, see prod.py)
# - Serving /static/ and /media/ directly, without going through the
#   Python process, per the original spec's "put static/media behind a
#   CDN/reverse proxy in production" guidance
# - Absorbing some request volume before it reaches the app (real
#   volumetric DDoS protection still needs a CDN/WAF in front of this,
#   per the app's own rate-limiting docs -- nginx here is not a
#   substitute for that, just the next layer in)
# - client_max_body_size as a hard request-size ceiling, matching the
#   spec's "implement request/upload size limits" requirement at the
#   layer that can enforce it before Django even sees the bytes

upstream app {
    # Scale by adding more `server` lines here (one per app container/
    # replica) once running more than one -- Daphne itself does not
    # fork multiple worker processes.
    server app:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    location /healthz/ {
        proxy_pass http://app;
        access_log off;
    }

    # WebSocket connections (chat) -- needs the Upgrade/Connection
    # headers forwarded, and a much longer read timeout than a normal
    # HTTP request since the connection is meant to stay open.
    location /ws/ {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
