    <script>
      // Set light/dark before first paint (no flash). Mirrors src/utils/theme.js.
      (function () {
        try {
          var t = localStorage.getItem('euphoria-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#24213A' : '#FFF8F1');
        } catch (e) {}
      })();
    </script>
